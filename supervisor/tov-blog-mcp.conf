; =============================================================================
; Supervisor config for tov-blog-mcp
; Place this file at: /etc/supervisor/conf.d/tov-blog-mcp.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update
;
; All configuration and secrets live in /srv/tov-blog-mcp/.env
; The server reads that file automatically on startup via loadEnv().
; Never put secrets in this file.
; =============================================================================

[program:tov-blog-mcp]

; ---------- Process ----------
command=/home/ubuntu/.nvm/versions/node/v22.21.1/bin/node /srv/tov-blog-mcp/dist/index.js
directory=/srv/tov-blog-mcp
user=ubuntu
environment=PATH="/home/ubuntu/.nvm/versions/node/v22.21.1/bin:/usr/local/bin:/usr/bin:/bin"

; ---------- Restart policy ----------
autostart=true
autorestart=true
startretries=5
startsecs=3

; ---------- Logging ----------
stdout_logfile=/var/log/tov-blog-mcp.log
stderr_logfile=/var/log/tov-blog-mcp-error.log

; ---------- Signal ----------
stopsignal=TERM
stopwaitsecs=10
