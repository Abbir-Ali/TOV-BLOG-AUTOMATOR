; =============================================================================
; Supervisor config for tov-blog-mcp
; Place this file at: /etc/supervisor/conf.d/tov-blog-mcp.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update
; =============================================================================

[program:tov-blog-mcp]

; ---------- Process ----------
command=/usr/bin/node /opt/tov-blog-mcp/dist/index.js
directory=/opt/tov-blog-mcp
user=ubuntu                             ; change to the user that owns /opt/tov-blog-mcp

; ---------- Environment ----------
; Put all secrets here — never in the code.
; Alternatively, use environment_files if your supervisor version supports it.
environment=
    NODE_ENV="production",
    HTTP_PORT="3100",
    MCP_ENV="prod",
    DRY_RUN="false",
    SHOPIFY_STORE_DOMAIN="tovfurniture.myshopify.com",
    ALLOWED_STORES="tovfurniture.myshopify.com",
    SHOPIFY_API_VERSION="2026-10",
    SHOPIFY_ADMIN_TOKEN="shpat_REPLACE_ME",
    PUBLIC_STORE_URL="https://tovfurniture.com",
    GOOGLE_SERVICE_ACCOUNT_JSON="BASE64_ENCODED_JSON_REPLACE_ME",
    ALLOWED_API_KEYS="key1_REPLACE_ME,key2_REPLACE_ME"

; ---------- Restart policy ----------
autostart=true
autorestart=true
startretries=5
startsecs=3

; ---------- Logging ----------
stdout_logfile=/var/log/supervisor/tov-blog-mcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/tov-blog-mcp-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; ---------- Signal ----------
stopsignal=TERM
stopwaitsecs=10
