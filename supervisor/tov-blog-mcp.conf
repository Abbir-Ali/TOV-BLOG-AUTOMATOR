; =============================================================================
; Supervisor config for tov-blog-mcp
; Place this file at: /etc/supervisor/conf.d/tov-blog-mcp.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update
;
; NOTE: the deployed copy holds live secrets — keep it root-only:
;   sudo chmod 600 /etc/supervisor/conf.d/tov-blog-mcp.conf
; The repo copy must keep the REPLACE_ME placeholders (never commit real tokens).
; =============================================================================

[program:tov-blog-mcp]

; ---------- Process ----------
; Node via nvm (matches tov-merchandising-ui / personalize-carousel-ui).
command=/home/ubuntu/.nvm/versions/node/v22.21.1/bin/node /srv/tov-blog-mcp/dist/index.js
directory=/srv/tov-blog-mcp
user=ubuntu

; ---------- Restart policy ----------
; Long-running HTTP MCP server — keep it up across crashes.
autostart=true
autorestart=true
startretries=5
startsecs=3

; ---------- Environment ----------
; Put all secrets here — never in the code. PATH must include the nvm bin dir
; so child processes resolve the right node/npm.
environment=
    NODE_ENV="production",
    HTTP_PORT="3101",
    MCP_ENV="prod",
    DRY_RUN="false",
    SHOPIFY_STORE_DOMAIN="REPLACE_ME",
    ALLOWED_STORES="REPLACE_ME",
    SHOPIFY_API_VERSION="2026-10",
    SHOPIFY_ADMIN_TOKEN="REPLACE_ME",
    PUBLIC_STORE_URL="REPLACE_ME",
    GOOGLE_SERVICE_ACCOUNT_JSON="REPLACE_ME_BASE64",
    ALLOWED_API_KEYS="REPLACE_ME_KEY1",
    OAUTH_BASE_URL="https://app.tovfurniture.com/mcp/tov-blog",
    OAUTH_TOKEN_SECRET="REPLACE_ME_64CHAR_HEX",
    OAUTH_DB_PATH="/srv/tov-blog-mcp/data/oauth.db",
    OAUTH_ACCESS_TOKEN_TTL="3600",
    OAUTH_REFRESH_TOKEN_TTL="86400",
    PATH="/home/ubuntu/.nvm/versions/node/v22.21.1/bin:/usr/local/bin:/usr/bin:/bin"

; ---------- Logging ----------
stdout_logfile=/var/log/tov-blog-mcp.log
stderr_logfile=/var/log/tov-blog-mcp-error.log

; ---------- Signal ----------
stopsignal=TERM
stopwaitsecs=10
